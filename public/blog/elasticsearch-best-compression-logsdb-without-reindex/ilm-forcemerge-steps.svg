<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">What the ILM forcemerge action does to one index</title>
  <desc id="d">ILM closes the index, applies the best_compression codec, reopens the index, and force merges. Three grey LZ4 segments become one smaller pink best_compression segment. Reads and writes to the index fail while it is closed.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ttl { fill: #e2e8f0; font-size: 17px; font-weight: 700; }
    .lbl { fill: #94a3b8; font-size: 13px; }
    .cap { fill: #e2e8f0; font-size: 15px; }
    .small { fill: #cbd5e1; font-size: 12px; }
    .s0 { animation: s0 12s infinite both; } .s1 { animation: s1 12s infinite both; } .s2 { animation: s2 12s infinite both; } .s3 { animation: s3 12s infinite both; } .closed { animation: closed 12s infinite both; } .pinkseg { animation: pinkseg 12s infinite both; } .merged { animation: merged 12s infinite both; } .greyseg { animation: greyback 12s infinite both; }
        @keyframes s0 { 0%,6% { opacity: .25; } 8%,28% { opacity: 1; } 31%,100% { opacity: .25; } }
    @keyframes s1 { 0%,26% { opacity: .25; } 28%,46% { opacity: 1; } 49%,100% { opacity: .25; } }
    @keyframes s2 { 0%,44% { opacity: .25; } 46%,62% { opacity: 1; } 65%,100% { opacity: .25; } }
    @keyframes s3 { 0%,60% { opacity: .25; } 62%,86% { opacity: 1; } 89%,100% { opacity: .25; } }
    @keyframes segsA { 0%,8% { opacity: 1; } 12%,28% { opacity: .25; } 46%,62% { opacity: 1; } 66%,100% { opacity: 0; } }
    @keyframes closed { 0%,8% { opacity: 0; } 12%,44% { opacity: 1; } 48%,100% { opacity: 0; } }
    @keyframes pinkseg { 0%,30% { opacity: 0; } 36%,62% { opacity: 1; } 66%,100% { opacity: 0; } }
    @keyframes merged { 0%,64% { opacity: 0; } 72%,92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes greyhide { 0%,28% { opacity: 1; } 34%,100% { opacity: 0; } }
    @keyframes greyback { 0%,8% { opacity: 1; } 12%,28% { opacity: .35; } 34%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .s0,.s1,.s2,.s3,.closed,.pinkseg,.greyseg { animation: none; opacity: 0; }
      .s0,.s1,.s2,.s3,.merged { opacity: 1; animation: none; }
    }
  </style>
  <rect width="800" height="380" rx="12" fill="#0f172a"/>
  <text x="32" y="40" class="ttl">ILM warm phase: forcemerge with index_codec</text>
  <g class="s0"><rect x="40" y="70" width="150" height="34" rx="17" fill="none" stroke="#94a3b8" stroke-width="1.5"/><text x="115" y="92" text-anchor="middle" class="small">1 · close</text></g><text x="205" y="92" class="lbl" text-anchor="middle">→</text><g class="s1"><rect x="220" y="70" width="150" height="34" rx="17" fill="none" stroke="#94a3b8" stroke-width="1.5"/><text x="295" y="92" text-anchor="middle" class="small">2 · set codec</text></g><text x="385" y="92" class="lbl" text-anchor="middle">→</text><g class="s2"><rect x="400" y="70" width="150" height="34" rx="17" fill="none" stroke="#94a3b8" stroke-width="1.5"/><text x="475" y="92" text-anchor="middle" class="small">3 · reopen</text></g><text x="565" y="92" class="lbl" text-anchor="middle">→</text><g class="s3"><rect x="580" y="70" width="150" height="34" rx="17" fill="none" stroke="#94a3b8" stroke-width="1.5"/><text x="655" y="92" text-anchor="middle" class="small">4 · force merge</text></g>
  <text x="40" y="146" class="lbl">One backing index (segments)</text>
  <g class="greyseg"><rect x="80" y="160" width="190" height="90" rx="6" fill="#64748b"/><rect x="290" y="160" width="190" height="90" rx="6" fill="#64748b"/><rect x="500" y="160" width="190" height="90" rx="6" fill="#64748b"/></g>
  <g class="pinkseg"><rect x="80" y="160" width="190" height="90" rx="6" fill="#f04e98"/><rect x="290" y="160" width="190" height="90" rx="6" fill="#f04e98"/><rect x="500" y="160" width="190" height="90" rx="6" fill="#f04e98"/></g>
  <g class="merged"><rect x="80" y="192" width="610" height="58" rx="6" fill="#f04e98"/><text x="385" y="282" text-anchor="middle" class="small">1 segment, smaller on disk</text></g>
  <g class="closed"><rect x="255" y="118" width="290" height="22" rx="11" fill="#fb7185"/><text x="400" y="134" text-anchor="middle" fill="#0f172a" style="font-size:12px;font-weight:700">CLOSED: reads and writes fail</text></g>
  <text x="40" y="330" class="cap">Run it on indices that no longer take writes.</text>
</svg>
