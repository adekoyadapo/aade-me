<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Churn fragments a shard until a merge rewrites it</title>
  <desc id="d">A shard starts with six clean segments. Updates and deletes flag documents in every segment and add two more small segments. The deleted share climbs past the 20 percent merge threshold. A merge rewrites the live documents into one clean segment.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ttl { fill: #e2e8f0; font-size: 17px; font-weight: 700; }
    .lbl { fill: #94a3b8; font-size: 13px; }
    .live { fill: #2dd4bf; }
    .dead { fill: #fb7185; }
    .churn { animation: churn 12s infinite both; }
    .extra { animation: extra 12s infinite both; }
    .oldrows { animation: oldrows 12s infinite both; }
    .merged { animation: merged 12s infinite both; }
    .gauge { animation: gauge 12s infinite both; }
    .st1 { animation: st1 12s infinite both; }
    .st2 { animation: st2 12s infinite both; }
    .st3 { animation: st3 12s infinite both; }
    @keyframes churn { 0%,12% { opacity: 0; } 50%,100% { opacity: 1; } }
    @keyframes extra { 0%,30% { opacity: 0; } 40%,66% { opacity: 1; } 72%,100% { opacity: 0; } }
    @keyframes oldrows { 0%,66% { opacity: 1; } 76%,94% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes merged { 0%,70% { opacity: 0; } 80%,94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes gauge { 0%,12% { transform: scaleX(0); } 50%,66% { transform: scaleX(1); } 78%,94% { transform: scaleX(0); } 100% { transform: scaleX(0); } }
    @keyframes st1 { 0%,10% { opacity: 1; } 14%,100% { opacity: 0; } }
    @keyframes st2 { 0%,12% { opacity: 0; } 20%,64% { opacity: 1; } 68%,100% { opacity: 0; } }
    @keyframes st3 { 0%,70% { opacity: 0; } 80%,94% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .churn,.extra,.oldrows,.merged,.gauge,.st1,.st2,.st3 { animation: none; }
      .churn,.extra,.oldrows,.st2 { opacity: 1; }
      .merged,.st1,.st3 { opacity: 0; }
      .gauge { transform: scaleX(1); }
    }
  </style>
  <rect width="800" height="400" rx="12" fill="#0f172a"/>
  <text x="32" y="40" class="ttl">Churn fragments a shard until a merge catches up</text>

  <text x="40" y="82" class="lbl">One shard, segments</text>
  <g class="oldrows">
    <g id="rows">
      <rect class="live" x="40" y="96"  width="360" height="24" rx="4"/>
      <rect class="live" x="40" y="128" width="360" height="24" rx="4"/>
      <rect class="live" x="40" y="160" width="360" height="24" rx="4"/>
      <rect class="live" x="40" y="192" width="360" height="24" rx="4"/>
      <rect class="live" x="40" y="224" width="360" height="24" rx="4"/>
      <rect class="live" x="40" y="256" width="360" height="24" rx="4"/>
    </g>
    <g class="churn">
      <rect class="dead" x="150" y="96"  width="250" height="24" rx="4"/>
      <rect class="dead" x="165" y="128" width="235" height="24" rx="4"/>
      <rect class="dead" x="155" y="160" width="245" height="24" rx="4"/>
      <rect class="dead" x="160" y="192" width="240" height="24" rx="4"/>
      <rect class="dead" x="170" y="224" width="230" height="24" rx="4"/>
      <rect class="dead" x="150" y="256" width="250" height="24" rx="4"/>
    </g>
    <g class="extra">
      <rect class="live" x="40" y="288" width="190" height="24" rx="4"/>
      <rect class="dead" x="40" y="320" width="120" height="24" rx="4"/>
    </g>
  </g>
  <g class="merged">
    <rect class="live" x="40" y="96" width="230" height="24" rx="4"/>
  </g>

  <text x="450" y="82" class="lbl">Deleted share of the shard</text>
  <rect x="450" y="96" width="320" height="26" rx="6" fill="#1e293b"/>
  <g transform="translate(450 96)"><rect class="gauge" x="0" y="0" width="320" height="26" rx="6" fill="#fb7185" style="transform-box:fill-box;transform-origin:0 50%"/></g>
  <rect x="450" y="96" width="320" height="26" rx="6" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M514 90 V 128" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="514" y="146" text-anchor="middle" class="lbl" style="fill:#fbbf24">20% merge priority</text>

  <rect x="450" y="176" width="320" height="168" rx="8" fill="#1e293b"/>
  <g class="st1"><text x="466" y="206" style="fill:#e2e8f0;font-size:14px">Start</text><text x="466" y="234" class="lbl">6 segments, 0 deleted.</text><text x="466" y="256" class="lbl">A search reads 6 segments.</text></g>
  <g class="st2"><text x="466" y="206" style="fill:#fb7185;font-size:14px">After the churn</text><text x="466" y="234" class="lbl">8 segments</text><text x="466" y="256" class="lbl">18,107 deleted vs 27,027 live</text><text x="466" y="278" class="lbl">1.27 MB on disk</text></g>
  <g class="st3"><text x="466" y="206" style="fill:#2dd4bf;font-size:14px">After a merge</text><text x="466" y="234" class="lbl">1 segment, 0 deleted</text><text x="466" y="256" class="lbl">same live documents (+1 write)</text><text x="466" y="278" class="lbl">0.79 MB on disk</text></g>

  <text x="40" y="378" class="lbl">Measured on Elasticsearch 9.5.5, one shard. Coral = flagged deleted.</text>
</svg>
